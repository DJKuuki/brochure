<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>未来飞行 · 尖端无人机与飞行系统工程画册 (50P 交互式翻页预览)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #05070c;
            color: #e2e8f0;
            font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* 顶部导航控制条 */
        .top-navbar {
            height: 56px;
            background: rgba(10, 15, 25, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 14pt;
            font-weight: 900;
            color: #00f0ff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .brand-desc {
            font-size: 9pt;
            color: #7dd3fc;
            font-family: 'Share Tech Mono', monospace;
            border-left: 1px solid rgba(0, 240, 255, 0.3);
            padding-left: 10px;
        }
        .controls-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-ctrl {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            color: #7dd3fc;
            padding: 6px 14px;
            border-radius: 4px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 9pt;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ctrl:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }
        .btn-ctrl.active {
            background: #00f0ff;
            color: #05070c;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        .page-status {
            font-family: 'Orbitron', monospace;
            font-size: 11pt;
            color: #00f0ff;
            min-width: 140px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 主舞台展示区 */
        .viewer-stage {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0d1524 0%, #05070c 100%);
        }

        .book-spread-container {
            position: relative;
            max-width: 95vw;
            max-height: 84vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.15);
            border-radius: 6px;
            overflow: hidden;
            background: #000;
            transition: transform 0.3s ease;
        }

        .page-display-slot {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #06090e;
        }

        .page-display-slot img {
            display: block;
            max-width: 100%;
            max-height: 84vh;
            object-fit: contain;
            pointer-events: none;
        }

        .spread-divider {
            width: 2px;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0, 240, 255, 0.2), rgba(0, 240, 255, 0.6), rgba(0, 240, 255, 0.2));
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
            z-index: 10;
        }

        /* 左右悬浮翻页大按钮 */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            background: rgba(10, 18, 30, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: #00f0ff;
            font-size: 24pt;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 50;
            border-radius: 4px;
            user-select: none;
            backdrop-filter: blur(4px);
        }
        .nav-arrow:hover {
            background: rgba(0, 240, 255, 0.25);
            border-color: #00f0ff;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            transform: translateY(-50%) scale(1.05);
        }
        .nav-arrow.prev { left: 20px; }
        .nav-arrow.next { right: 20px; }

        /* 缩略图抽屉全景网格 */
        .drawer-overlay {
            position: absolute;
            top: 56px; left: 0; right: 0; bottom: 0;
            background: rgba(5, 7, 12, 0.95);
            backdrop-filter: blur(12px);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 25px 40px;
            overflow-y: auto;
        }
        .drawer-overlay.open {
            display: flex;
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
            padding-bottom: 12px;
        }
        .drawer-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 14pt;
            color: #00f0ff;
            letter-spacing: 2px;
        }
        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .thumb-card {
            background: #0c121d;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }
        .thumb-card:hover {
            border-color: #00f0ff;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3);
        }
        .thumb-card.active {
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        .thumb-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .thumb-card .thumb-lbl {
            font-family: 'Share Tech Mono', monospace;
            font-size: 8pt;
            color: #7dd3fc;
            padding: 6px 8px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: space-between;
        }

        /* 底部信息条 */
        .bottom-bar {
            height: 38px;
            background: rgba(10, 15, 25, 0.95);
            border-top: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 8pt;
            color: #64748b;
        }
        .bottom-bar span strong {
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <!-- 顶部导航控制条 -->
    <div class="top-navbar">
        <div class="brand-title">
            <span class="brand-logo">AEROSPACE DYNAMICS</span>
            <span class="brand-desc">尖端无人机与飞行系统工程画册 // 50P交互翻阅器</span>
        </div>

        <div class="controls-group">
            <button class="btn-ctrl" id="btnModeSingle" onclick="setMode('single')">单页单面查看</button>
            <button class="btn-ctrl active" id="btnModeSpread" onclick="setMode('spread')">双页对开装订预览</button>
            <button class="btn-ctrl" onclick="toggleDrawer()">☷ 全景缩略图 (50P)</button>
            <button class="btn-ctrl" onclick="openPdfFile()">⬇ 打开印刷PDF文件</button>
        </div>

        <div class="controls-group">
            <div class="page-status" id="pageStatus">PAGE 01 / 50</div>
            <button class="btn-ctrl" onclick="toggleFullscreen()">⛶ 全屏展示</button>
        </div>
    </div>

    <!-- 主展示区 -->
    <div class="viewer-stage">
        <div class="nav-arrow prev" onclick="prevPage()">&#10094;</div>
        
        <div class="book-spread-container" id="bookContainer">
            <!-- 左页 (对开模式下显示) -->
            <div class="page-display-slot" id="slotLeft" style="display:none;">
                <img id="imgLeft" src="" alt="Left Page" />
            </div>
            
            <div class="spread-divider" id="spreadDivider" style="display:none;"></div>
            
            <!-- 右页 / 单页 -->
            <div class="page-display-slot" id="slotRight">
                <img id="imgRight" src="" alt="Right Page" />
            </div>
        </div>

        <div class="nav-arrow next" onclick="nextPage()">&#10095;</div>
    </div>

    <!-- 缩略图抽屉网格 -->
    <div class="drawer-overlay" id="drawer">
        <div class="drawer-header">
            <h2>全景 50 页蓝图画廊 (BLUEPRINT ARCHIVE GALLERY)</h2>
            <button class="btn-ctrl" onclick="toggleDrawer()">✕ 关闭画廊 (ESC)</button>
        </div>
        <div class="thumb-grid" id="thumbGrid">
            <!-- 动态生成50个缩略图卡片 -->
        </div>
    </div>

    <!-- 底部状态条 -->
    <div class="bottom-bar">
        <div>
            PRINT STANDARD: <strong>SINGLE-SIDED 297x210mm A4 LANDSCAPE</strong> | BINDING: <strong>BACK-TO-BACK MOUNTED</strong>
        </div>
        <div>
            快捷键: <strong>[←]</strong> 上一页 | <strong>[→]</strong> 下一页 | <strong>[F]</strong> 全屏 | <strong>[ESC]</strong> 退出画廊
        </div>
    </div>

    <script>
        const TOTAL_PAGES = 50;
        let currentPage = 1; // 1-indexed
        let viewMode = 'spread'; // 'single' or 'spread'

        function getPageSrc(p) {
            const pad = String(p).padStart(2, '0');
            return `./brochure_pages/page_${pad}.png`;
        }

        function setMode(mode) {
            viewMode = mode;
            document.getElementById('btnModeSingle').classList.toggle('active', mode === 'single');
            document.getElementById('btnModeSpread').classList.toggle('active', mode === 'spread');
            renderCurrent();
        }

        function renderCurrent() {
            const slotLeft = document.getElementById('slotLeft');
            const slotRight = document.getElementById('slotRight');
            const spreadDivider = document.getElementById('spreadDivider');
            const imgLeft = document.getElementById('imgLeft');
            const imgRight = document.getElementById('imgRight');
            const pageStatus = document.getElementById('pageStatus');

            if (viewMode === 'single') {
                slotLeft.style.display = 'none';
                spreadDivider.style.display = 'none';
                slotRight.style.display = 'flex';
                imgRight.src = getPageSrc(currentPage);
                
                const typeText = (currentPage % 2 === 1) ? 'OBVERSE · 展面' : 'REVERSE · 详述';
                pageStatus.innerText = `PAGE ${String(currentPage).padStart(2, '0')} / ${TOTAL_PAGES} [${typeText}]`;
            } else {
                // 对开模式 (Spread Mode)
                // 封面 P1 单独展示在右侧
                if (currentPage === 1) {
                    slotLeft.style.display = 'none';
                    spreadDivider.style.display = 'none';
                    slotRight.style.display = 'flex';
                    imgRight.src = getPageSrc(1);
                    pageStatus.innerText = `PAGE 01 / 50 [COVER · 封面]`;
                } 
                // 封底 P50 单独展示在左侧或右侧
                else if (currentPage >= TOTAL_PAGES) {
                    slotLeft.style.display = 'none';
                    spreadDivider.style.display = 'none';
                    slotRight.style.display = 'flex';
                    imgRight.src = getPageSrc(TOTAL_PAGES);
                    pageStatus.innerText = `PAGE 50 / 50 [BACK COVER · 封底]`;
                } 
                // 内页对开：偶数页在左（介绍），奇数页在右（大图）
                else {
                    let leftP = (currentPage % 2 === 0) ? currentPage : currentPage - 1;
                    let rightP = leftP + 1;
                    if (leftP < 2) leftP = 2;
                    if (rightP > TOTAL_PAGES) rightP = TOTAL_PAGES;

                    slotLeft.style.display = 'flex';
                    spreadDivider.style.display = 'block';
                    slotRight.style.display = 'flex';

                    imgLeft.src = getPageSrc(leftP);
                    imgRight.src = getPageSrc(rightP);
                    pageStatus.innerText = `P${String(leftP).padStart(2, '0')} (详述) + P${String(rightP).padStart(2, '0')} (展面)`;
                }
            }
            updateActiveThumb();
        }

        function prevPage() {
            if (viewMode === 'single') {
                if (currentPage > 1) {
                    currentPage--;
                    renderCurrent();
                }
            } else {
                if (currentPage <= 2) {
                    currentPage = 1;
                } else if (currentPage % 2 === 1) {
                    currentPage -= 2;
                } else {
                    currentPage -= 2;
                }
                if (currentPage < 1) currentPage = 1;
                renderCurrent();
            }
        }

        function nextPage() {
            if (viewMode === 'single') {
                if (currentPage < TOTAL_PAGES) {
                    currentPage++;
                    renderCurrent();
                }
            } else {
                if (currentPage === 1) {
                    currentPage = 2;
                } else {
                    currentPage += 2;
                }
                if (currentPage > TOTAL_PAGES) currentPage = TOTAL_PAGES;
                renderCurrent();
            }
        }

        function goToPage(p) {
            currentPage = p;
            document.getElementById('drawer').classList.remove('open');
            renderCurrent();
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            drawer.classList.toggle('open');
        }

        function openPdfFile() {
            window.open('./Aero_UAV_Brochure_50P_Print_Ready.pdf', '_blank');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // 初始化50页缩略图卡片
        function initThumbnails() {
            const grid = document.getElementById('thumbGrid');
            grid.innerHTML = '';
            for (let i = 1; i <= TOTAL_PAGES; i++) {
                const card = document.createElement('div');
                card.className = 'thumb-card';
                card.id = `thumb-${i}`;
                card.onclick = () => goToPage(i);

                const img = document.createElement('img');
                img.src = getPageSrc(i);
                img.loading = 'lazy';

                const lbl = document.createElement('div');
                lbl.className = 'thumb-lbl';
                const tag = (i === 1) ? '封面' : (i === 50) ? '封底' : (i % 2 === 1) ? '正面大图' : '背面介绍';
                lbl.innerHTML = `<span>P${String(i).padStart(2, '0')}</span><span>${tag}</span>`;

                card.appendChild(img);
                card.appendChild(lbl);
                grid.appendChild(card);
            }
        }

        function updateActiveThumb() {
            document.querySelectorAll('.thumb-card').forEach(el => el.classList.remove('active'));
            const activeCard = document.getElementById(`thumb-${currentPage}`);
            if (activeCard) activeCard.classList.add('active');
        }

        // 键盘按键监听
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevPage();
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'Escape') document.getElementById('drawer').classList.remove('open');
            if (e.key === 'f' || e.key === 'F') toggleFullscreen();
        });

        // 启动执行
        initThumbnails();
        renderCurrent();
    </script>
</body>
</html>
