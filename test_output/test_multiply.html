<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@page { size: 297mm 210mm; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: #fbfbfd;
    color: #1d1d1f;
}
.page-exhibition {
    width: 297mm;
    height: 210mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 16mm 22mm 14mm 22mm;
    background: #ffffff;
}
.exhibit-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.exhibit-series {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #86868b;
}
.exhibit-cat-pill {
    font-size: 10px;
    font-weight: 600;
    color: #0071e3;
    background: #f5f5f7;
    padding: 4px 12px;
    border-radius: 12px;
}
.exhibit-hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}
.hero-img-box {
    width: 100%;
    height: 140mm;
    display: flex;
    align-items: center;
    justify-content: center;
}
.hero-img-box img {
    max-width: 95%;
    max-height: 135mm;
    object-fit: contain;
    mix-blend-mode: multiply;
}
.exhibit-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 1px solid #f0f0f2;
    padding-top: 10px;
}
.exhibit-name-block h2 {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #1d1d1f;
}
.exhibit-name-block p {
    font-size: 11px;
    color: #86868b;
    margin-top: 3px;
}
.exhibit-folio {
    font-size: 14px;
    font-weight: 600;
    color: #86868b;
}
</style>
</head>
<body>
<div class="page-exhibition">
    <div class="exhibit-top">
        <div class="exhibit-series">EXHIBIT // 01 · MASTER SERIES</div>
        <div class="exhibit-cat-pill">智能航拍平台 · Autonomous Aerial Drone</div>
    </div>
    <div class="exhibit-hero">
        <div class="hero-img-box">
            <img src="file:///e:/brochure/飞机截图/7.jpg" alt="">
        </div>
    </div>
    <div class="exhibit-bottom">
        <div class="exhibit-name-block">
            <h2>AERO-STREAM 7 // 仿生流线型智能航拍无人机</h2>
            <p>Sleek Aerodynamic Smart Aerial Drone — SPEC-STR7</p>
        </div>
        <div class="exhibit-folio">005</div>
    </div>
</div>
</body>
</html>
